name: balut_operator
description: Balut candling workspace for Android, matching the web workflow.
publish_to: none
version: 0.4.1+5

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/certificates/balut-local-box.pem
  fonts:
    - family: BalutSerif
      fonts:
        - asset: assets/fonts/LibreCaslonText-Regular.ttf
