services:
  - type: web
    name: balut-demo
    runtime: docker
    plan: free
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: BALUT_OPERATOR_USERNAME
        sync: false
      - key: BALUT_OPERATOR_PASSWORD_HASH
        sync: false
      - key: BALUT_LOCAL_ADMIN_TOKEN
        sync: false
      - key: BALUT_DEVICE_SHARED_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
